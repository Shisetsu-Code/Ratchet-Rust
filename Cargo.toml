[workspace]
members = ["crates/core", "crates/worker"]
exclude = ["crypto-wasm"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
base64 = "=0.23.1"
uuid = { version = "=1.28.0", features = ["serde"] }
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
sha2 = "=0.11.1"
hmac = "=0.13.0"
hkdf = "=0.13.0"
zeroize = "=1.9.1"
worker = { version = "=0.8.7", features = ["d1"] }
futures-util = "=0.3.34"
futures-channel = "=0.3.34"
getrandom = { version = "=0.4.3", features = ["wasm_js"] }
pbkdf2 = { version = "=0.13.0", features = ["hmac"] }
subtle = "=2.6.1"
ed25519-dalek = "=3.0.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = true
# Keep bindgen's externref metadata; see cloudflare/workers-rs#1014.
strip = "debuginfo"
codegen-units = 1
opt-level = "s"

