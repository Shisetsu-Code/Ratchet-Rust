[workspace]
members = ["crates/core"]
exclude = ["crypto-wasm"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
base64 = "=0.23.1"
uuid = { version = "=1.28.0", features = ["serde"] }
aes-gcm = "=0.11.1"
sha2 = "=0.11.1"
hmac = "=0.13.0"
hkdf = "=0.13.0"
zeroize = "=1.9.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "s"

