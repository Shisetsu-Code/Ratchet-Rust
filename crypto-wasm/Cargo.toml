[package]
name = "ratchet-crypto-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
getrandom = { version = "=0.4.3", features = ["wasm_js"] }
rand = "=0.10.2"
wasm-bindgen = "=0.2.128"
xeddsa = "=1.1.0"
zeroize = "=1.9.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
